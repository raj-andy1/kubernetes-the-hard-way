apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-ingress-policy
  namespace: database
spec:
  podSelector:
    matchLabels:
      role: database
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: backend
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hostpath-pvc
  namespace: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: database
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    role: database
  name: database
  namespace: database
spec:
  containers:
  - image: postgres:18.3-alpine3.23
    name: database
    volumeMounts:
      - name: data-volume
        mountPath: /data
    envFrom:
    - secretRef:
        name: database-secrets
    - configMapRef:
        name: database-config
    ports:
    - containerPort: 5432
    resources: {}
  dnsPolicy: ClusterFirst
  tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  nodeSelector:
    kubernetes.io/hostname: cka-practice-control-plane
  volumes:
    - name: data-volume
      persistentVolumeClaim:
        claimName: hostpath-pvc
  restartPolicy: Always

---
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: database
data:
  POSTGRES_USER: YXBwdXNlcg== 
  POSTGRES_PASSWORD: YXBwUGFzc3dvcmQ=
  POSTGRES_DB: YXBwREI=

---
apiVersion: v1
data:
  PGDATA: /data
kind: ConfigMap
metadata:
  name: database-config
  namespace: database

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: database-service
  name: database-service
  namespace: database
spec:
  ports:
  - port: 5432
    protocol: TCP
    targetPort: 5432
  selector:
    role: database
  type: ClusterIP
